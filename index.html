<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard FEDER Ultramarin</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; padding: 2rem; }
        .header { background: linear-gradient(135deg, #003399, #0055A4); color: white;
                  padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 2rem; }
        .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin: 2rem 0; }
        .card { background: white; padding: 1.5rem; border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-left: 5px solid #FFCC00; }
        .card h4 { color: #666; font-size: 0.85rem; text-transform: uppercase; }
        .card .value { font-size: 1.8rem; font-weight: bold; color: #003399; }
        .chart { background: white; padding: 1.5rem; border-radius: 15px;
                 box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin: 1.5rem 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🇪🇺 Dashboard FEDER Ultramarin</h1>
        <p>Programmes DROM/COM 2014-2020 — Données réelles Cohesion Open Data</p>
    </div>

    <div class="metrics" id="metrics"></div>

    <div class="chart"><div id="chart-funds" style="height:400px;"></div></div>
    <div class="chart"><div id="chart-territoires" style="height:400px;"></div></div>
    <div class="chart"><div id="chart-evolution" style="height:400px;"></div></div>

    <script>
        // Données des 9 programmes ultramarins (budgets corrigés)
        const programmes = [
            { cci: '2014FR05M2OP001', territoire: 'Guadeloupe + St-Martin', fonds: ['ERDF', 'ESF'], ue: 60.15, total: 70.76 },
            { cci: '2014FR05SFOP003', territoire: 'Guyane', fonds: ['ESF'], ue: 34.53, total: 46.69 },
            { cci: '2014FR05SFOP004', territoire: 'Martinique', fonds: ['ESF'], ue: 59.86, total: 78.55 },
            { cci: '2014FR05SFOP005', territoire: 'Réunion', fonds: ['ESF'], ue: 237.64, total: 297.05 },
            { cci: '2014FR06RDRP001', territoire: 'Guadeloupe', fonds: ['EAFRD'], ue: 51.97, total: 60.18 },
            { cci: '2014FR06RDRP002', territoire: 'Martinique', fonds: ['EAFRD'], ue: 62.13, total: 72.78 },
            { cci: '2014FR06RDRP003', territoire: 'Guyane', fonds: ['EAFRD'], ue: 35.77, total: 42.08 },
            { cci: '2014FR06RDRP004', territoire: 'Réunion', fonds: ['EAFRD'], ue: 108.66, total: 134.46 },
            { cci: '2014FR06RDRP006', territoire: 'Mayotte', fonds: ['EAFRD'], ue: 21.23, total: 28.30 }
        ];

        // Métriques
        const totalUE = programmes.reduce((s, p) => s + p.ue, 0);
        const totalBudget = programmes.reduce((s, p) => s + p.total, 0);
        const nbProgrammes = programmes.length;
        const nbTerritoires = new Set(programmes.map(p => p.territoire.replace(' + St-Martin', ''))).size;

        document.getElementById('metrics').innerHTML = `
            <div class="card"><h4>💰 Contribution UE</h4><div class="value">${totalUE.toFixed(2)} M€</div></div>
            <div class="card"><h4>💵 Budget Total</h4><div class="value">${totalBudget.toFixed(2)} M€</div></div>
            <div class="card"><h4>📋 Programmes</h4><div class="value">${nbProgrammes}</div></div>
            <div class="card"><h4>🗺️ Territoires</h4><div class="value">${nbTerritoires}</div></div>
        `;

        // Graphique 1 : Répartition par fonds
        const fondsUE = {};
        programmes.forEach(p => {
            p.fonds.forEach(f => {
                fondsUE[f] = (fondsUE[f] || 0) + p.ue / p.fonds.length;
            });
        });

        Plotly.newPlot('chart-funds', [{
            labels: Object.keys(fondsUE),
            values: Object.values(fondsUE),
            type: 'pie', hole: 0.4,
            marker: { colors: ['#003399', '#28a745', '#fd7e14'] }
        }], { title: 'Répartition de la Contribution UE par Fonds', height: 400 });

        // Graphique 2 : Budget par territoire
        const parTerritoire = {};
        programmes.forEach(p => {
            const t = p.territoire.replace(' + St-Martin', '');
            parTerritoire[t] = (parTerritoire[t] || 0) + p.ue;
        });

        Plotly.newPlot('chart-territoires', [{
            x: Object.keys(parTerritoire),
            y: Object.values(parTerritoire),
            type: 'bar',
            marker: { color: '#003399' },
            text: Object.values(parTerritoire).map(v => v.toFixed(2) + ' M€'),
            textposition: 'outside'
        }], {
            title: 'Contribution UE par Territoire (M€)',
            xaxis: { title: '' }, yaxis: { title: 'M€' }, height: 400
        });

        // Graphique 3 : Budget par programme
        Plotly.newPlot('chart-evolution', [{
            x: programmes.map(p => p.cci),
            y: programmes.map(p => p.ue),
            type: 'bar',
            marker: { color: programmes.map(p => p.fonds.includes('ESF') ? '#28a745' : '#fd7e14') },
            text: programmes.map(p => p.ue.toFixed(2) + ' M€'),
            textposition: 'outside'
        }], {
            title: 'Contribution UE par Programme (M€)',
            xaxis: { tickangle: -45 }, yaxis: { title: 'M€' },
            height: 400, margin: { b: 150 }
        });
    </script>
</body>
</html>
